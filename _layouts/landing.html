<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body{% if page.sim %} class="has-banner"{% endif %}>

    {% include header.html %}

    {% if page.sim %}
        {% include banner.html %}
    {% else %}
        <section id="banner" class="compact style2">
            <div class="banner-veil"></div>
            <div class="inner">
                <header class="major">
                    <h1>{{ page.title }}</h1>
                </header>
                {% if page.description %}
                <div class="content">
                    <p>{{ page.description }}</p>
                </div>
                {% endif %}
            </div>
        </section>
    {% endif %}

    {% include page-top.html %}

    {{ content }}

    {% include footer.html %}

</body>

</html>
