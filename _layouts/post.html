<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body{% if page.sim %} class="has-banner"{% endif %}>

    {% include header.html %}

    {% include banner.html %}

    {% include page-top.html %}

<!-- Main -->
<div id="main" class="alt"{% if page.accent %} data-accent="{{ page.accent }}"{% endif %}>

<!-- One -->
<section id="one">
	<div class="inner">
		{% unless page.sim %}
		<header class="major">
			<h1>{{ page.title }}</h1>
			{% if page.description %}<p>{{ page.description }}</p>{% endif %}
		</header>
		{% endunless %}
		{{ content }}
	</div>
</section>

</div>

    {% include footer.html %}

</body>

</html>
